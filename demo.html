<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bailes Chinos</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="sitio" title="Sitio Bailes Chinos" src="./index.html"></iframe>
  <script>
    document.getElementById('sitio').addEventListener('load', function () {
      try {
        const doc = this.contentDocument;
        const style = doc.createElement('style');
        style.textContent = '#admin-open, #admin-dialog { display: none !important; }';
        doc.head.appendChild(style);
      } catch (error) {
        console.error('No se pudo ocultar el acceso de administración.', error);
      }
    });
  </script>
</body>
</html>

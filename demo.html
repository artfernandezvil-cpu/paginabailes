<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bailes Chinos — Demostración</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="sitio" title="Bailes Chinos" src="./index.html"></iframe>
<script>
/* Demo independiente: mantiene toda la página original y cambia los
marcadores de Olmué (Granizo y San Judas Tadeo) sin tocar el resto. */
const frame=document.getElementById('sitio');
function banner(kind){
const judas=kind==='judas',label=judas?'SAN JUDAS TADEO':'GRANIZO';
const color=judas?'#247557':'#a83937';
const inner=judas?'<circle cx="38" cy="30" r="12" fill="#edc58e"/><path d="M17 70 Q20 40 38 43 Q56 40 59 70" fill="#e9d0a1"/><path d="M28 44L38 56 48 44" fill="#f5f2d9"/><path d="M29 23q9-14 18 0" stroke="#513f29" stroke-width="5" fill="none"/>':'<path d="M16 48L38 13 60 48 38 40Z" fill="#eed9a7"/><circle cx="38" cy="31" r="10" fill="#e9bf80"/><path d="M23 69q1-26 15-26t15 26" fill="#e9d9ac"/>';
const svg='<svg xmlns="http://www.w3.org/2000/svg" width="76" height="100" viewBox="0 0 76 100"><path d="M38 1L70 15V66L38 83 6 66V15Z" fill="'+color+'" stroke="#f7d78c" stroke-width="4"/><path d="M38 83V99" stroke="#926c34" stroke-width="4"/>'+inner+'<path d="M10 67H66V79H10Z" fill="#fff0c7"/><text x="38" y="75" text-anchor="middle" font-size="'+(judas?8:11)+'" font-family="Arial" font-weight="bold" fill="#392f29">'+label+'</text></svg>';
return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)
}
function apply(){
let d,w;try{d=frame.contentDocument;w=frame.contentWindow;if(!d)return}catch(e){return}
const admin=d.querySelectorAll('#admin-open,#admin-dialog');admin.forEach(el=>el.style.setProperty('display','none','important'));
if(!d.getElementById('demo-markers-style')){const s=d.createElement('style');s.id='demo-markers-style';s.textContent='.demo-banner-icon{background:transparent!important;border:0!important;filter:drop-shadow(0 3px 3px #0007)}';d.head.appendChild(s)}
const maps=[];
for(const key of Object.keys(w)){let v;try{v=w[key]}catch(e){continue}if(v&&typeof v.eachLayer==='function'&&typeof v.getCenter==='function')maps.push(v)}
function rename(marker,name){
if(!w.L||typeof marker.setIcon!=='function')return;
const b=/judas|tadeo/i.test(name)?'judas':/granizo/i.test(name)?'granizo':null;
if(!b)return;
const tag='demo-'+b;
if(marker._demoBanner===tag)return;
marker.setIcon(w.L.icon({iconUrl:banner(b),iconSize:[55,72],iconAnchor:[27,70],popupAnchor:[0,-65],className:'demo-banner-icon'}));
marker._demoBanner=tag
}
maps.forEach(m=>m.eachLayer(layer=>{if(typeof layer.getLatLng!=='function')return;
const popup=layer.getPopup?.()?.getContent?.()||'',tooltip=layer.getTooltip?.()?.getContent?.()||'';
const x=String(popup)+' '+String(tooltip)+' '+String(layer.options?.title||'');
rename(layer,x)
}));
/* Compatible con marcadores generados en HTML sin instancia Leaflet global */
d.querySelectorAll('.leaflet-marker-icon').forEach(el=>{
const x=[el.title,el.alt,el.getAttribute('aria-label'),el.outerHTML].join(' ');
const b=/judas|tadeo/i.test(x)?'judas':/granizo/i.test(x)?'granizo':null;
if(b&&!el.dataset.demoBanner){el.src=banner(b);el.dataset.demoBanner=b;el.style.width='55px';el.style.height='72px'}
});
}
frame.addEventListener('load',()=>{apply();setInterval(apply,1200)});

// Corrección de historia: pestañas verticales y lectura hacia abajo.
function restoreStory(){
 let d,w;try{d=frame.contentDocument;w=frame.contentWindow;if(!d||!w)return}catch(e){return}
 const section=d.querySelector('#historia')||d.querySelector('.story-section');
 if(!section)return;
 let tabs=d.querySelector('#story-tabs'),panel=d.querySelector('#story-panel');
 if(!tabs||!panel){
   const layout=section.querySelector('.story-layout')||section.querySelector('.story-timeline')||section.querySelector('.story-content');
   if(!layout)return;
   let chapters=[];try{chapters=w.eval('state.contents.chapters')}catch(e){}
   if(!chapters.length)return;
   layout.innerHTML='<div id="story-tabs" class="story-tabs" role="tablist"></div><article id="story-panel" class="story-article" role="tabpanel"></article>';
   layout.classList.add('story-layout');tabs=d.querySelector('#story-tabs');panel=d.querySelector('#story-panel');
   const esc=s=>String(s||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
   const render=i=>{tabs.innerHTML=chapters.map((ch,j)=>'<button role="tab" data-chapter="'+j+'" aria-selected="'+(i===j)+'" class="'+(i===j?'active':'')+'">'+esc(ch.label)+'</button>').join('');const ch=chapters[i];panel.innerHTML='<h3>'+esc(ch.title)+'</h3>'+esc(ch.body).split(/\\n\\s*\\n/).map(p=>'<p>'+p.replace(/\\n/g,'<br>')+'</p>').join('');};
   tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-chapter]');if(b)render(+b.dataset.chapter)});render(0);
 }
 if(!d.getElementById('story-vertical-fix')){
 const st=d.createElement('style');st.id='story-vertical-fix';
 st.textContent='.story-layout{display:grid!important;grid-template-columns:280px minmax(0,1fr)!important;overflow:visible!important;align-items:start!important}.story-tabs{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;overflow:visible!important;white-space:normal!important;border-right:1px solid #dedbd2!important;padding:18px 22px 18px 0!important}.story-tabs button{display:block!important;width:100%!important;text-align:left!important;font-size:13px!important;padding:16px 14px!important;white-space:normal!important;flex:none!important}.story-tabs button.active{background:#233c61!important;color:#fff!important}.story-article{max-width:none!important;min-width:0!important;padding:40px 44px!important;overflow:visible!important;height:auto!important;max-height:none!important}.story-article p{white-space:normal!important;line-height:1.9!important}@media(max-width:700px){.story-layout{grid-template-columns:1fr!important}.story-tabs{border-right:0!important;border-bottom:1px solid #dedbd2!important;padding:10px 0!important}.story-article{padding:24px 8px!important}}';
 d.head.appendChild(st);
 }
}
frame.addEventListener('load',()=>{restoreStory();setInterval(restoreStory,1800)});
</script></body></html>
